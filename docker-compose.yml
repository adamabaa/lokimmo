version: '3.8'

services:
  php:
    build: ./backend
    container_name: lokimmo_php
    volumes:
      - ./backend:/var/www/html
    networks:
      - lokimmo_net
    env_file:
      - ./backend/.env

  nginx:
    image: nginx:alpine
    container_name: lokimmo_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - lokimmo_net

  mysql:
    image: mysql:8.0
    container_name: lokimmo_mysql
    environment:
      MYSQL_DATABASE: lokimmo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: lokimmo
      MYSQL_PASSWORD: lokimmo
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lokimmo_net

networks:
  lokimmo_net:

volumes:
  mysql_data: