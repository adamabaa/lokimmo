<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" width="210" height="44">
  <defs>
    <linearGradient id="gGN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A84C"/>
      <stop offset="50%" style="stop-color:#F0C96B"/>
      <stop offset="100%" style="stop-color:#B8922A"/>
    </linearGradient>
    <filter id="sh2">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Icône maison mini -->
  <g filter="url(#sh2)">
    <!-- Toit -->
    <polygon points="22,3 40,16 4,16" fill="url(#gGN)"/>
    <!-- Cheminée -->
    <rect x="29" y="6" width="3.5" height="7" rx="0.5" fill="#F0C96B"/>
    <!-- Corps -->
    <rect x="7" y="15" width="30" height="22" rx="1.5" fill="#1A1A1A"/>
    <!-- Fenêtres -->
    <rect x="10" y="19" width="9" height="7" rx="1.5" fill="url(#gGN)" opacity="0.85"/>
    <rect x="25" y="19" width="9" height="7" rx="1.5" fill="url(#gGN)" opacity="0.85"/>
    <!-- Porte -->
    <rect x="16" y="24" width="12" height="13" rx="2" fill="#0D0D0D"/>
    <circle cx="25" cy="31" r="1.2" fill="url(#gGN)"/>
    <!-- Sol -->
    <rect x="3" y="36.5" width="38" height="2" rx="1" fill="url(#gGN)"/>
  </g>
  <!-- Texte Lok -->
  <text x="52" y="30" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#1A1A1A" letter-spacing="-0.5">Lok</text>
  <!-- Texte immo or -->
  <text x="104" y="30" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="url(#gGN)" letter-spacing="-0.5">immo</text>
</svg>
